<div class="coiffures">
  <header>
    <span>OUR WORK</span>
    <h1 class="title">{{ 'gallery.title' | translate }}</h1>
  </header>

  <div class="stats">
    <article class="card" *ngFor="let item of coiffures; let i = index">
      <figure class="image-card">
        <img
          [src]="item.img"
          [alt]="'coiffures.' + item.key + '.alt' | translate"
        >

        <figcaption>
          <span>0{{ i + 1 }}</span>
          {{ 'coiffures.' + item.key + '.label' | translate }}
        </figcaption>
      </figure>
    </article>
  </div>
</div>
