<!-- LOGO / TITLE -->
<mat-toolbar color="accent" class="main-header">
  <div class="header-left">
    <figure class="logo">
      <img src="assets/img/gmhb.png" alt="GMHB" />
    </figure>

    <div class="brand-text">
      <h1 class="logo-title">GMHB</h1>
      <p class="h-description">
        {{ "header.description" | translate }}
      </p>
    </div>
  </div>

  <!-- NAV -->
  <nav id="main-navigation" class="main-nav" [class.open]="isMenuOpen">
    <button
      mat-icon-button
      class="close-menu"
      (click)="closeMenu()"
      aria-label="Close menu"
    >
      ✕
    </button>

    <a routerLink="/home" (click)="closeMenu()">{{ "nav.home" | translate }}</a>
    <a routerLink="/services" (click)="closeMenu()">{{
      "nav.services" | translate
    }}</a>
    <a routerLink="/contact" (click)="closeMenu()">{{
      "nav.contact" | translate
    }}</a>
    <a routerLink="/dashboard" (click)="closeMenu()">{{
      "nav.galerie" | translate
    }}</a>

    <button mat-button (click)="toggleGrayscaleAndCloseMenu()">
      🌓 {{ "ui.bwMode" | translate }}
    </button>

    <button mat-button (click)="switchLangAndCloseMenu('fr')" aria-label="Français">🇫🇷</button>
    <button mat-button (click)="switchLangAndCloseMenu('en')" aria-label="English">🇺🇸</button>
    <button mat-button (click)="switchLangAndCloseMenu('es')" aria-label="Español">🇪🇸</button>
  </nav>

  <!-- BURGER -->
  <button
    mat-icon-button
    class="burger"
    (click)="toggleMenu()"
    aria-label="Menu"
    aria-controls="main-navigation"
    [attr.aria-expanded]="isMenuOpen"
  >
    ☰
  </button>
</mat-toolbar>
